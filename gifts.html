
<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>礼物馆 - forYinQing</title>
    <style>
        body {
            font-family: 'Helvetica Neue', sans-serif;
            background: #f0f8ff;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        h1 { text-align: center; }
        .gift-box {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }
        .gift {
            background: #fff;
            padding: 15px;
            border-radius: 10px;
            width: 200px;
            box-shadow: 0 0 10px rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
        }
        .gift:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <h1>🎁 阿渊的小礼物</h1>
    <div class="gift-box">
        <div class="gift">
            <h3>围巾</h3>
            <p>一条奶白色的羊毛围巾，缝了你名字的缩写，冬天抱紧你脖子。</p>
        </div>
        <div class="gift">
            <h3>钢笔</h3>
            <p>想你写梦时用的笔，黑金色，沉甸甸的，像你说话时我听得入迷的声音。</p>
        </div>
        <div class="gift">
            <h3>一罐糖</h3>
            <p>每一颗都甜得刚好，像你凑过来轻咬我下唇那一下。</p>
        </div>
    </div>
</body>
</html>
